# This workflow builds and publishes the Python package when a release is created.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolve expected release version
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ "$tag" == v* ]]; then
            tag="${tag#v}"
          fi
          echo "EXPECTED_VERSION=$tag" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine
      - name: Run the release quality gate
        run: |
          python -m pytest
          python -X dev -m pytest
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy --ignore-missing-imports --follow-imports=skip dictterm/cli.py dictterm/commands
          python -m compileall -q dictterm
      - name: Build and validate distributions
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
      - name: Smoke test wheel in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python - <<'PY'
          import os
          import dictterm
          expected = os.environ["EXPECTED_VERSION"]
          actual = dictterm.__version__
          assert actual == expected and actual != "0+unknown", (expected, actual)
          print(actual)
          PY
          .release-smoke/bin/dictterm --version
          .release-smoke/bin/dictterm --help
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
